# Continuous integration: on every push and pull request, install the project
# exactly as pinned in uv.lock, then run the linter, formatter check and tests.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked --no-group notebooks  # fails if uv.lock is out of date with pyproject.toml

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

  database:
    # Build the Postgres + PostGIS + pgvector image, check the extensions work, then
    # run the database tests (pytest -m db), using the same compose.yaml and commands
    # as on the developer's Mac. The tests build the database from the committed
    # reference files and made-up sites, so CI does not depend on DEFRA's servers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from the example (throwaway password; CI only)
        run: cp .env.example .env

      - name: Build and start the database
        run: docker compose up -d --build --wait

      - name: Check extensions
        run: docker compose exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < docker/db/check.sql

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked --no-group notebooks

      - name: Run database tests
        run: uv run --env-file .env pytest -m db

      - name: Stop the database
        if: always()
        run: docker compose down -v
