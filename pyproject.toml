[project]
name = "caz"
version = "0.1.0"
description = "Causal impact of England's Clean Air Zones on NO2, and a decision tool for cities considering one."
readme = "README.md"
authors = [
    { name = "Patrick Bolton", email = "patrick.d.bolton@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
    "pandera>=0.36.0",
    "psycopg[binary]>=3.3.9",
    "rdata>=1.1.0",
    "requests>=2.34.2",
    "shapely>=2.2.0",
    "sqlalchemy>=2.1.9",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
notebooks = [
    "folium>=0.20.0",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: style errors, F: pyflakes (unused imports, undefined names), I: import sorting,
# B: bugbear (likely bugs), UP: modern Python syntax, N: naming conventions.
select = ["E", "W", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Database tests need the Postgres container; they are skipped by default.
# Run them with:  uv run --env-file .env pytest -m db
addopts = "-ra -m 'not db'"
markers = ["db: needs the database container (docker compose up -d --wait)"]

[tool.uv]
# Plain `uv sync` installs both groups; CI skips the notebook group (--no-group notebooks).
default-groups = ["dev", "notebooks"]
